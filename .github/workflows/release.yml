# Publie une Release à chaque push sur main.
#
# Version publiée :
#   - si <Version> du .csproj est plus récente que la dernière Release (MAJEUR ou MINEUR augmenté à la main),
#     c'est elle qui est publiée ;
#   - sinon, le CORRECTIF de la dernière Release est augmenté automatiquement (1.4.0 -> 1.4.1).
# La version calculée est passée à la compilation, puis écrite dans le .csproj par un commit « [skip ci] »
# (qui ne relance pas ce workflow) : après un git pull, la version locale est celle publiée.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculer la version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $raw = ([xml](Get-Content DofusRetroManager/DofusRetroManager.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if (-not $raw) { throw "Aucune <Version> dans le .csproj" }
          $base = [version]$raw

          $latest = gh release list --limit 200 --json tagName --jq '.[].tagName' |
            ForEach-Object { $v = $null; if ([version]::TryParse($_.TrimStart('v'), [ref]$v)) { $v } } |
            Sort-Object -Descending | Select-Object -First 1

          if (-not $latest -or $base -gt $latest) { $next = $base }
          else { $next = [version]::new($latest.Major, $latest.Minor, $latest.Build + 1) }

          $text = "$($next.Major).$($next.Minor).$([Math]::Max($next.Build, 0))"
          "version=$text" >> $env:GITHUB_OUTPUT
          "Version du .csproj : $base · dernière Release : $latest · version publiée : $text"

      - name: Installer .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Construire l'installateur
        shell: pwsh
        run: ./build-installer.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Publier la Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          # Notes : la section « ## <version> » de CHANGELOG.md ; sans elle (correctif publié automatiquement), celles de GitHub
          $notes = @('--generate-notes')
          $changelog = [IO.File]::ReadAllText("CHANGELOG.md")
          $section = [regex]::Match($changelog, "(?ms)^## $([regex]::Escape($version))\b[^\n]*\n(.*?)(?=^## |\z)")
          if ($section.Success -and $section.Groups[1].Value.Trim()) {
            [IO.File]::WriteAllText("release-notes.md", $section.Groups[1].Value.Trim(), [Text.UTF8Encoding]::new($false))
            $notes = @('--notes-file', 'release-notes.md')
          }
          # Copie sous l'ancien nom : les versions 1.32 et avant (« Dofus Bank Manager ») cherchent ce fichier pour se mettre à jour
          Copy-Item dist/DofusRetroManager-Setup.msi dist/DofusBankManager-Setup.msi
          gh release create $tag dist/DofusRetroManager-Setup.msi dist/DofusBankManager-Setup.msi `
            --target "${{ github.sha }}" `
            --title $tag `
            @notes

      # Miroir Cloudflare (update/README.md) : l'application s'y met à jour quand GitHub ne répond pas. L'installateur est
      # découpé en morceaux de 20 Mo (limite de 25 Mo par fichier d'un Worker). Sans le secret CLOUDFLARE_API_TOKEN, étape
      # ignorée ; un échec ne bloque pas la suite (la Release GitHub est déjà publiée).
      - name: Publier sur le miroir Cloudflare
        continue-on-error: true
        shell: pwsh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if (-not $env:CLOUDFLARE_API_TOKEN) { "Secret CLOUDFLARE_API_TOKEN absent : miroir non mis à jour."; exit 0 }
          $version = "${{ steps.version.outputs.version }}"
          $msi = "dist/DofusRetroManager-Setup.msi"
          $pub = "update/public"
          Get-ChildItem $pub -Exclude _headers | Remove-Item
          $bytes = [IO.File]::ReadAllBytes($msi)
          $chunk = 20MB
          $parts = @()
          for ($i = 0; $i * $chunk -lt $bytes.Length; $i++) {
            $name = "DofusRetroManager-Setup-$version.msi.$i"
            $len = [Math]::Min($chunk, $bytes.Length - $i * $chunk)
            $seg = [byte[]]::new($len)
            [Array]::Copy($bytes, $i * $chunk, $seg, 0, $len)
            [IO.File]::WriteAllBytes("$pub/$name", $seg)
            $parts += $name
          }
          $sha = (Get-FileHash $msi -Algorithm SHA256).Hash.ToLower()
          $json = [ordered]@{ version = $version; sha256 = $sha; size = $bytes.Length; parts = $parts } | ConvertTo-Json
          [IO.File]::WriteAllText("$pub/version.json", $json, [Text.UTF8Encoding]::new($false))
          Get-Content "$pub/version.json"
          Set-Location update
          npx --yes wrangler@4 deploy

      - name: Reporter la version dans le .csproj
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $csproj = "DofusRetroManager/DofusRetroManager.csproj"
          # Repartir du main à jour : un autre commit a pu arriver pendant la construction
          git fetch origin main
          git checkout -B main origin/main
          $current = [version](([xml](Get-Content $csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          # Jamais de retour en arrière (ex. MINEUR augmenté à la main entre-temps)
          if ($current -ge [version]$version) { "Le .csproj est déjà en $current : rien à faire."; exit 0 }

          $text = [IO.File]::ReadAllText($csproj)
          $text = [regex]::Replace($text, '<Version>[^<]*</Version>', "<Version>$version</Version>")
          [IO.File]::WriteAllText($csproj, $text, [Text.UTF8Encoding]::new($true))

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $csproj
          git commit -m "Version $version [skip ci]"
          git push origin main
